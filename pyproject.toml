[project]
name = "crewai-agentic-harness-workshop"
version = "0.1.0"
description = "A zero-to-hero CrewAI agentic harness workshop"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "crewai[litellm]==1.15.22",
  "crewai-tools[mcp]>=1.0,<2",
  "mcp>=1.0,<2",
  "ollama>=0.4,<1",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "ipykernel>=6,<7", "jupyterlab>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
