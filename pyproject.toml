[project]
name = "crewai-agentic-harness-workshop"
version = "0.1.0"
description = "A zero-to-hero CrewAI agentic harness workshop"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "crewai[litellm]==1.15.22",
  "crewai-tools[mcp]>=1.0,<2",
  "mcp>=1.0,<2",
  "ollama>=0.4,<1",
  "pydantic>=2.0,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
advanced = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "lancedb>=0.20,<1",
  "nemoguardrails>=0.16,<1",
  "langfuse>=3,<4",
  "openinference-instrumentation-crewai>=0.1,<1",
  "ragas>=0.3,<1",
  "podman-compose>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "ipykernel>=6,<7", "jupyterlab>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
